[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-sales-forecasting"
version = "0.1.0"
description = "Retail sales forecasting and business planning analytics project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "openpyxl",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "jupyterlab",
    "notebook",
    "ipykernel"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]